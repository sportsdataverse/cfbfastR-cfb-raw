[project]
name = "cfbfastr-cfb-raw"
version = "0.1.0"
description = "Scrapes ESPN college-football game JSON into raw + enriched final per-game files."
requires-python = ">=3.11"
dependencies = [
    "sportsdataverse>=0.0.69",
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "requests>=2.28",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# Track git main, matching cfbfastR-cfb-data. A GIT source works on a clean CI
# runner (uv fetches it); the constraint recorded here previously was against a
# sibling PATH source, which does not, and that is still true.
#
# Pinning to PyPI meant the reprocess pipeline silently ran whatever was last
# released. The parser fixes this depends on -- ESPN's -1 end.yardsToEndzone
# sentinel, the opportunity_run gate, and the boolean fill_null no-op behind
# rushing_power_rate -- all landed on main after 0.0.73, so a reprocess would
# have rebuilt final/ with the defects still in place, and the next scheduled run
# would have silently reverted any manual repair.
sportsdataverse = { git = "https://github.com/sportsdataverse/sportsdataverse-py", branch = "main" }

# sportsdataverse floor covers the offline-reprocess features: game_rosters
# column-width fix (missing in 0.0.52), the 0.0.60 espn_cfb_schedule guard for
# null-competitor placeholder events that crashed whole seasons (2010/2014), and
# the 0.0.69 roster-backed {type}_player_id + CFBPlayProcess(game_roster=,
# participants=) params the reprocess pipeline passes for fetch-free, id-aware
# rebuilds.

[tool.pytest.ini_options]
markers = ["live: hits the live ESPN API (gated by CFB_LIVE_TESTS=1)"]
testpaths = ["tests"]
pythonpath = ["python"]
