name: Scrape CFB Raw Data

# Serialize every workflow in this repo that commits to it. Two runs in flight
# put one of them behind origin and its push is rejected -- and because the git
# calls are wrapped in `>/dev/null` with no rc check, that lands as a GREEN job
# that published nothing. wehoop-wnba-data runs 32192069433 + 32192069566
# (2026-08-18) are the worked example.
#
# The group is REPO-wide, not per-workflow: the daily, weekly and annual jobs all
# commit to the same branch, so a per-workflow group would still let the daily
# race the weekly.
#
# cancel-in-progress is FALSE on purpose -- these runs also upload release
# assets, and cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 9 * 8 *'        # August (preseason)
    - cron: '0 9 * 9-11 *'     # Sept-Nov (regular season)
    - cron: '0 9 * 12 *'       # all December -- most bowls fall Dec 21-31
    - cron: '0 9 1-25 1 *'     # January bowls + CFP, past the ~Jan 19-20 final
  workflow_dispatch:
    inputs:
      start_year:
        description: 'Start year'
        required: false
        type: string
      end_year:
        description: 'End year'
        required: false
        type: string
      rescrape:
        description: 'Rescrape existing games'
        required: false
        type: boolean
        default: false
      hollow:
        description: 'Rescrape only hollow/missing games from logs/scrape_failures.csv'
        required: false
        type: boolean
        default: false

jobs:
  scrape_cfb_raw:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      START_YEAR: ${{ inputs.start_year }}
      END_YEAR: ${{ inputs.end_year }}
      RESCRAPE: ${{ inputs.rescrape }}
      HOLLOW: ${{ inputs.hollow }}
    steps:
      # The checkout materialises ~76 GB of tracked JSON (json/final alone is 58 GB
      # across 19,750 files averaging 2.9 MB, because each final embeds plays +
      # advBoxScore + all five aux datasets). A current ubuntu-latest has roughly
      # 65-70 GB free, so this repo sat just under the ceiling until the 2026-08-27
      # run committed aux data for 946 games. The next run then died mid-scrape with
      # "No space left on device" after ~3 hours, having pushed nothing (run
      # 33208979285).
      #
      # Reclaiming the preinstalled toolchains buys ~30 GB. It runs BEFORE checkout
      # so the space exists when it is needed.
      #
      # This is a reprieve, not a cure: json/final grows ~3 GB per season. The
      # durable fix is to stop committing enriched finals at this size (they
      # duplicate the aux datasets they embed) or to split the tree.
      - name: Reclaim runner disk before checkout
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v5

      # Fail loudly and EARLY if the tree still does not fit, rather than dying three
      # hours into a scrape having written nothing.
      - name: Assert disk headroom
        run: |
          df -h / | tail -1
          avail=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          echo "available after checkout: ${avail} GB"
          if [ "${avail}" -lt 10 ]; then
            echo "::error ::only ${avail} GB free after checkout; the scrape writes more and would die mid-run"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Default year inputs if empty
        if: ${{ env.START_YEAR == '' }}
        run: |
          YR=$(uv run python -c "import sys; sys.path.insert(0,'python'); from cfb_raw_scrape._cfb_raw_utils import most_recent_cfb_season as m; print(m())")
          echo "START_YEAR=$YR" >> $GITHUB_ENV
          echo "END_YEAR=$YR" >> $GITHUB_ENV

      - name: Default rescrape if empty
        if: ${{ env.RESCRAPE == '' }}
        run: echo "RESCRAPE=false" >> $GITHUB_ENV

      - name: Default hollow if empty
        if: ${{ env.HOLLOW == '' }}
        run: echo "HOLLOW=false" >> $GITHUB_ENV

      - name: Scrape CFB Raw ${{ env.START_YEAR }}-${{ env.END_YEAR }}
        run: bash scripts/daily_cfb_scraper.sh -s ${{ env.START_YEAR }} -e ${{ env.END_YEAR }} -r ${{ env.RESCRAPE }} -h ${{ env.HOLLOW }}
